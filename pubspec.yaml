name: no_swan
description: "No Swan – Hintergrundbild je nach Entfernung zur Home-Position."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.2          # GPS-Position + Distanzberechnung
  shared_preferences: ^2.3.2   # Home-Position, Radius, Bildpfade speichern
  image_picker: ^1.1.2         # Bilder "Zuhause" / "Unterwegs" auswählen
  path_provider: ^2.1.4        # Bilder dauerhaft im App-Ordner ablegen
  workmanager: ^0.10.10        # Hintergrund-Prüfung (Android, ca. alle 15 min)
  async_wallpaper: ^3.6.0      # Android: Systemhintergrund setzen (WallpaperManager)
  permission_handler: ^12.0.1   # "Standort immer" + Akku-Optimierung

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
